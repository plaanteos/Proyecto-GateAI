<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnionTech - Sistema de Control de Acceso v2.0</title>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Estilos base -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        /* Ocultar el loading cuando la app está lista */
        .app-ready .loading-screen {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga -->
    <div class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Iniciando UnionTech</div>
        <div class="loading-subtext">Sistema de Control de Acceso v2.0</div>
    </div>

    <!-- La aplicación se cargará aquí -->
    <div id="app"></div>

    <!-- Scripts principales -->
    <script src="src/app-complete.js"></script>
    <script>
        // Ocultar pantalla de carga cuando la app esté lista
        setTimeout(() => {
            document.body.classList.add('app-ready');
        }, 2000);
        
        // Log de inicio
        console.log('🚀 UnionTech v2.0 - Sistema de Control de Acceso');
        console.log('📋 Características:');
        console.log('   ✓ Múltiples roles de usuario');
        console.log('   ✓ Dashboards diferenciados');
        console.log('   ✓ Gestión avanzada de invitados');
        console.log('   ✓ Validación biométrica');
        console.log('   ✓ Base de datos SQL Server');
        console.log('🎯 Sistema listo para demostración');
    </script>
</body>
</html>
